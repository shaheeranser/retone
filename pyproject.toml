[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retone"
version = "0.1.0"
description = "Offline, no-hallucination photo enhancement: a small fine-tuned Qwen VLM picks adjustment values, OpenCV applies them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]
upload = [
    "datasets>=2.20",
    "huggingface-hub>=0.24",
]
train = [
    "accelerate>=1.0",
    "datasets>=2.20",
    "huggingface-hub>=0.24",
    "lm-format-enforcer>=0.10",
    "peft>=0.13",
    "pillow>=10",
    "transformers>=4.46",
    "trl>=0.12",
    "unsloth",
]

[project.urls]
Repository = "https://github.com/shaheeranser/retone"

[project.scripts]
retone = "retone.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retone"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["specs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "N", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["retone"]

[[tool.mypy.overrides]]
module = [
    "accelerate",
    "accelerate.*",
    "datasets",
    "datasets.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "lmformatenforcer",
    "lmformatenforcer.*",
    "peft",
    "peft.*",
    "PIL",
    "PIL.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "trl",
    "trl.*",
    "unsloth",
    "unsloth.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests"]
markers = ["integration: needs the real model, server or network; skipped by default"]
